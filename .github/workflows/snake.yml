name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Generates the contribution snake animation (dark and light versions)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg?color_snake=#a371f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            github-snake-dark.svg?palette=github-dark&color_snake=#a371f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Commits the new SVGs only if there were changes
      - name: Commit & push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          git diff --staged --quiet || git commit -m "[Skip GitHub Action] Update snake"
          git push