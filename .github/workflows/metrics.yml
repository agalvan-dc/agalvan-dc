name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Generates the main SVG: header, languages, calendar, activity, repos and lines of code
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          config_timezone: Europe/Madrid
          config_animated: yes
          config_padding: "1%"
          config_order: header, languages, isocalendar, topics, activity, repositories, followup
          theme: nightowl

          base: header, activity, community, repositories

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: mastered

          plugin_followup: yes

          plugin_lines: yes

  # Generates the achievements SVG: trophies + contribution streak
  trophies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-trophies.svg
          base: ""
          theme: nightowl
          config_padding: "1%"
          config_order: trophies, achievements, streak

          plugin_trophies: yes
          plugin_trophies_title: "Trophies"

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          plugin_streak: yes
          plugin_streak_highlight: yes